<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vastlands Workbench</title>
<style>
  :root { --ui: rgba(14,20,28,0.9); --line: rgba(160,200,230,0.22); --txt: #dbe6ee; --acc: #9fe8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161d; color: var(--txt); font: 12px/1.4 "Segoe UI", system-ui, sans-serif; }
  #side { position: fixed; left: 0; top: 0; bottom: 0; width: 330px; overflow: auto; background: var(--ui); border-right: 1px solid var(--line); padding: 12px; z-index: 2; }
  #view { position: fixed; left: 330px; right: 0; top: 0; bottom: 0; }
  h1 { font-size: 15px; letter-spacing: 3px; font-weight: 400; margin: 0 0 10px; }
  .sec { margin: 12px 0 6px; font-size: 10px; letter-spacing: 2px; opacity: .6; }
  label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  select, input[type=number], input[type=text], textarea { background: #0b1016; color: var(--txt); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; font: inherit; }
  select { flex: 1; } input[type=range] { flex: 1; }
  textarea { width: 100%; height: 150px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  button { background: var(--acc); color: #06121a; border: 0; padding: 5px 10px; border-radius: 3px; font-weight: 600; cursor: pointer; margin: 2px 2px 2px 0; }
  button.ghost { background: transparent; color: var(--txt); border: 1px solid var(--line); }
  button.on { background: #ffd27a; }
  pre { white-space: pre-wrap; background: #0b1016; border: 1px solid var(--line); padding: 6px; border-radius: 3px; margin: 4px 0; max-height: 230px; overflow: auto; font-size: 11px; }
  .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; } .maps canvas { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .ok { color: #7dffb2; } .bad { color: #ff8a6a; } .dim { opacity: .6; }
  @media (max-width: 700px) { #side { width: 100%; bottom: 50%; } #view { left: 0; top: 50%; } }
</style>
</head>
<body>
<div id="side"></div>
<div id="view"></div>
<script type="module" src="/src/workbench/main.ts"></script>
</body>
</html>
